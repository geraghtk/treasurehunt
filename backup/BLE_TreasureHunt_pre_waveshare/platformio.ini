; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 4.2" B/W: 0 = GDEW042T2 / IL0398 (GxEPD2_420), 1 = GDEY042T81 / SSD1683 — must match the flex PCB / Waveshare wiki
; EPD_SOLID_TEST=1: first screen is solid black (no bitmap) — use once to see if the panel updates at all
build_flags =
  -D USE_GDEY042T81=1
  -D EPD_SOLID_TEST=1
lib_deps =
  zinggjm/GxEPD2 @ ^1.5.6
  adafruit/Adafruit GFX Library @ ^1.11.0
