<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Serial Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 12px;
      gap: 10px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 { font-size: 1rem; color: #a0c4ff; letter-spacing: 1px; }

    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    #status-dot.connected { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
    #status-dot.error     { background: #f44336; box-shadow: 0 0 6px #f44336; }

    #status-text { font-size: 0.75rem; color: #888; }

    /* Tabs */
    .tab-bar {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #2a2a4a;
      padding-bottom: 0;
    }

    .tab {
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-bottom: none;
      color: #888;
      padding: 5px 16px;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
    }
    .tab:hover { color: #e0e0e0; }
    .tab.active { background: #0d0d1a; color: #a0c4ff; border-color: #2a2a4a; }

    .tab-content { display: none; flex: 1; min-height: 0; }
    .tab-content.active { display: flex; flex-direction: column; gap: 10px; }

    /* Live status tab */
    #beacon-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      flex: 1;
    }

    .beacon-card {
      border-radius: 8px;
      border: 2px solid #333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.3s, border-color 0.3s;
      background: #0d0d1a;
    }
    .beacon-card.detected {
      background: #0a2a0a;
      border-color: #4caf50;
    }
    .beacon-card.not-found {
      background: #2a0a0a;
      border-color: #f44336;
    }

    .beacon-card-name {
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .beacon-card.detected .beacon-card-name  { color: #4caf50; }
    .beacon-card.not-found .beacon-card-name { color: #f44336; }

    .beacon-card-mac    { font-size: 0.7rem; color: #555; }
    .beacon-card-rssi   { font-size: 0.75rem; color: #888; }

    .beacon-card-status {
      font-size: 0.8rem;
      letter-spacing: 1px;
      padding: 2px 10px;
      border-radius: 3px;
    }
    .beacon-card.detected .beacon-card-status  { color: #4caf50; border: 1px solid #4caf50; }
    .beacon-card.not-found .beacon-card-status { color: #f44336; border: 1px solid #f44336; }

    #live-summary {
      font-size: 0.8rem;
      text-align: center;
      color: #888;
      padding: 4px;
    }
    #live-summary.clear   { color: #4caf50; }
    #live-summary.warning { color: #ffa726; }

    /* Log tab */
    #log-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      background: #16213e;
      border: 1px solid #333;
      color: #a0c4ff;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    button:hover { background: #0f3460; }

    label { font-size: 0.8rem; color: #888; display: flex; align-items: center; gap: 6px; }

    #terminal {
      flex: 1;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 10px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .line { white-space: pre-wrap; word-break: break-all; }
    .line .ts { color: #444; font-size: 0.75rem; margin-right: 8px; user-select: none; }
    .line.detected { color: #4caf50; }
    .line.gone     { color: #f44336; }
    .line.scan     { color: #a0c4ff; }
    .line.status   { color: #888; font-style: italic; }
    .line.default  { color: #e0e0e0; }

    #send-bar { display: flex; gap: 8px; }

    #send-input {
      flex: 1;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      color: #e0e0e0;
      padding: 6px 10px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
    }
    #send-input:focus { outline: none; border-color: #a0c4ff; }
    #send-btn { background: #0f3460; border-color: #a0c4ff; }
  </style>
</head>
<body>

<header>
  <div id="status-dot"></div>
  <h1>ESP32 SERIAL MONITOR — COM4</h1>
  <span id="status-text">Connecting...</span>
</header>

<div class="tab-bar">
  <button class="tab active" data-tab="live">Live Status</button>
  <button class="tab" data-tab="log">Log</button>
</div>

<!-- Live Status Tab -->
<div class="tab-content active" id="tab-live">
  <div id="beacon-grid"></div>
  <div id="live-summary">Waiting for scan...</div>
</div>

<!-- Log Tab -->
<div class="tab-content" id="tab-log">
  <div id="log-controls">
    <button id="clear-btn">Clear</button>
    <button id="pause-btn">Pause</button>
    <label><input type="checkbox" id="autoscroll" checked> Auto-scroll</label>
    <label><input type="checkbox" id="timestamps" checked> Timestamps</label>
  </div>
  <div id="terminal"></div>
</div>

<div id="send-bar">
  <input id="send-input" type="text" placeholder="Send command to ESP32..." />
  <button id="send-btn">Send</button>
</div>

<script>
  const terminal   = document.getElementById('terminal');
  const statusDot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const autoscroll = document.getElementById('autoscroll');
  const timestamps = document.getElementById('timestamps');
  const pauseBtn   = document.getElementById('pause-btn');
  const sendInput  = document.getElementById('send-input');
  const liveSummary = document.getElementById('live-summary');
  const grid       = document.getElementById('beacon-grid');

  const BEACONS = [
    { mac: 'f2:6c:8d:69:56:5d', name: 'Strawberry' },
    { mac: 'e4:ce:26:90:96:cf', name: 'Flower'     },
    { mac: 'd8:fe:b6:49:be:57', name: 'Dog'         },
    { mac: 'd5:65:c6:25:a1:5a', name: 'Cat'         },
    { mac: 'e6:b9:7d:7d:4b:8e', name: 'Dumbo'       },
    { mac: 'd6:e7:1f:86:0b:56', name: 'Penguin'     },
  ];

  // Build beacon cards
  const beaconCards = {};
  BEACONS.forEach(b => {
    const card = document.createElement('div');
    card.className = 'beacon-card not-found';

    const name = document.createElement('div');
    name.className = 'beacon-card-name';
    name.textContent = b.name;

    const mac = document.createElement('div');
    mac.className = 'beacon-card-mac';
    mac.textContent = b.mac;

    const status = document.createElement('div');
    status.className = 'beacon-card-status';
    status.textContent = 'not found';

    const rssi = document.createElement('div');
    rssi.className = 'beacon-card-rssi';
    rssi.textContent = '';

    card.appendChild(name);
    card.appendChild(mac);
    card.appendChild(status);
    card.appendChild(rssi);
    grid.appendChild(card);
    beaconCards[b.mac] = { card, status, rssi };
  });

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });

  // Track state for change detection
  const beaconState = {};

  function updateBeaconPanel(line, ts) {
    const lower = line.toLowerCase();

    const match = line.match(/(\w+)\s+\(([0-9a-f:]{17})\):\s*(DETECTED|not seen)(?:\s*\((-?\d+)\s*dBm\))?/i);
    if (match) {
      const name = match[1];
      const mac  = match[2].toLowerCase();
      const detected = match[3].toLowerCase() === 'detected';
      const rssiVal  = match[4] ? parseInt(match[4]) : null;

      if (beaconCards[mac]) {
        const { card, status, rssi } = beaconCards[mac];
        card.className  = 'beacon-card ' + (detected ? 'detected' : 'not-found');
        status.textContent = detected ? 'DETECTED' : 'not found';
        rssi.textContent = detected && rssiVal !== null ? `${rssiVal} dBm` : '';
      }

      // Log state changes
      if (beaconState[mac] !== detected) {
        beaconState[mac] = detected;
        appendLine(`${name} → ${detected ? 'DETECTED' : 'not seen'}`, detected ? 'detected' : 'gone', ts);
      }
      return true;
    }

    if (lower.includes('all clear')) {
      liveSummary.textContent = line.trim();
      liveSummary.className = 'clear';
      return true;
    }
    if (lower.includes('warning')) {
      liveSummary.textContent = line.trim();
      liveSummary.className = 'warning';
      return true;
    }
    if (lower.includes('--- beacon status ---')) return true;

    return false;
  }

  let paused = false;
  const MAX_LINES = 500;

  const ws = new WebSocket(`ws://${location.host}`);

  ws.onopen = () => {
    statusDot.className = 'connected';
    statusText.textContent = 'Connected';
  };

  ws.onclose = () => {
    statusDot.className = 'error';
    statusText.textContent = 'Disconnected — restart server';
  };

  ws.onmessage = e => {
    if (paused) return;
    const { type, data, ts } = JSON.parse(e.data);

    if (type === 'status') { appendLine(data, 'status', ts); return; }
    if (updateBeaconPanel(data, ts)) return;

    let cls = 'default';
    if (data.toLowerCase().includes('--- scan')) cls = 'scan';
    appendLine(data, cls, ts);
  };

  function appendLine(text, cls, ts) {
    while (terminal.children.length >= MAX_LINES)
      terminal.removeChild(terminal.firstChild);

    const div = document.createElement('div');
    div.className = `line ${cls}`;

    if (timestamps.checked) {
      const tsSpan = document.createElement('span');
      tsSpan.className = 'ts';
      tsSpan.textContent = new Date(ts).toLocaleTimeString();
      div.appendChild(tsSpan);
    }

    div.appendChild(document.createTextNode(text));
    terminal.appendChild(div);

    if (autoscroll.checked) terminal.scrollTop = terminal.scrollHeight;
  }

  document.getElementById('clear-btn').addEventListener('click', () => terminal.innerHTML = '');

  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    pauseBtn.style.color = paused ? '#ffa726' : '';
  });

  document.getElementById('send-btn').addEventListener('click', sendCommand);
  sendInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendCommand(); });

  function sendCommand() {
    const val = sendInput.value.trim();
    if (!val) return;
    ws.send(JSON.stringify({ command: val }));
    appendLine('> ' + val, 'scan', Date.now());
    sendInput.value = '';
  }
</script>
</body>
</html>
